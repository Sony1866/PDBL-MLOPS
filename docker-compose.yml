# ═══════════════════════════════════════════════════════════
# Docker Compose — PDBL-MLOPS Full Stack
# ═══════════════════════════════════════════════════════════

services:
  # ── Frontend (Next.js) ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # ── Backend (FastAPI) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount model files into /models/ inside the container
      - ./best_model_regresi2.pkl:/app/models/best_model_regresi2.pkl:ro
      - ./model_tuned_final.pkl:/app/models/model_tuned_final.pkl:ro
      - ./threshold_tuned.pkl:/app/models/threshold_tuned.pkl:ro
      - ./best_params.pkl:/app/models/best_params.pkl:ro
      - ./selected_features.pkl:/app/models/selected_features.pkl:ro
    environment:
      - MODEL_DIR=/app/models
    restart: unless-stopped
